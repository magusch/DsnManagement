{% load admin_urls %}
{% if error %}
<div style="padding: 16px; background: var(--dsn-error-bg); border: 1px solid var(--dsn-error-border); border-radius: 4px;">
    <p style="margin: 0; color: var(--dsn-error-strong); font-weight: bold;">{{ error }}</p>
</div>
{% else %}
<div style="padding: 16px; background: var(--dsn-success-bg); border: 1px solid var(--dsn-success-border); border-radius: 4px;">
    <p style="margin: 0 0 8px 0; color: var(--dsn-success-fg); font-weight: bold;">
        Пост сохранён!
    </p>
    <p style="margin: 0; font-size: 13px;">
        «{{ post.title }}» — статус: черновик.
        <a href="{{ admin_url }}" style="color: var(--dsn-accent);">Открыть в админке</a>
    </p>
</div>
{% endif %}
