{% extends "admin/change_list.html" %}

{% block extrahead %}
    {{ block.super }}
    {% include "content_generator/partials/tg_post_card_css.html" %}
    <style>
        .cg-theme-toolbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            background: var(--dsn-code-bg); border: 1px solid var(--dsn-card-border); border-radius: 4px;
            padding: 10px 12px; margin-bottom: 10px;
        }
        .cg-theme-toolbar label { font-size: 12px; color: var(--dsn-text-quiet); font-weight: bold; }
        .cg-theme-toolbar select { padding: 4px 8px; border: 1px solid var(--dsn-input-border); border-radius: 4px; max-width: 320px; }
        .cg-theme-toolbar .button { cursor: pointer; }
        .cg-theme-toolbar button[disabled] { opacity: 0.55; cursor: default; }
        #cg-theme-status { font-size: 12px; color: var(--dsn-text-muted); }
        #cg-theme-status.cg-error { color: var(--dsn-c-ba2121); }
        #cg-theme-status.cg-ok { color: var(--dsn-c-2f7d32); }
        .cg-theme-result {
            border: 1px solid var(--dsn-card-border); border-radius: 4px; background: var(--dsn-panel-bg);
            padding: 12px; margin-bottom: 12px; max-width: 760px;
        }
        .cg-theme-result h3 { margin: 0 0 8px; font-size: 14px; color: var(--dsn-accent); }
        .cg-theme-result .cg-meta { font-size: 12px; color: var(--dsn-text-soft); margin-bottom: 8px; }
        .cg-theme-result details { margin-top: 10px; }
        .cg-theme-result details summary { cursor: pointer; font-size: 12px; color: var(--dsn-accent); }
        .cg-theme-result textarea {
            width: 100%; min-height: 160px; margin-top: 6px; font-family: monospace;
            font-size: 12px; border: 1px solid var(--dsn-input-border); border-radius: 4px; padding: 8px;
        }
        .cg-spinner {
            display: inline-block; width: 11px; height: 11px; border: 2px solid var(--dsn-input-border);
            border-top-color: var(--dsn-accent); border-radius: 50%; animation: cg-spin 0.8s linear infinite;
            vertical-align: -1px; margin-right: 4px;
        }
        @keyframes cg-spin { to { transform: rotate(360deg); } }
    </style>
{% endblock %}

{% block object-tools %}
    <div class="cg-theme-toolbar">
        <label for="cg-theme-select">Тема:</label>
        <select id="cg-theme-select">
            <option value="">Авто — тема, которую дольше всех не постили</option>
            {% for fs in theme_filter_sets %}
                <option value="{{ fs.id }}">{{ fs.name }}</option>
            {% endfor %}
        </select>
        <button type="button" class="button" id="cg-theme-generate">Сгенерировать пост</button>
        <button type="button" class="button" id="cg-theme-preview" style="background:#6f42c1;">Предпросмотр (dry run)</button>
        <span id="cg-theme-status"></span>
    </div>
    <div class="cg-theme-result" id="cg-theme-result" style="display:none;"></div>

    <form style="display:none;">{% csrf_token %}</form>

    <script>
    (function() {
        var THEME_URL = '{% url "cg_theme_post" %}';
        var STATUS_URL = '{% url "cg_theme_post_status" %}';
        var POLL_INTERVAL = 3000;
        var POLL_TIMEOUT = 180000;

        var selectEl = document.getElementById('cg-theme-select');
        var statusEl = document.getElementById('cg-theme-status');
        var resultEl = document.getElementById('cg-theme-result');
        var buttons = [document.getElementById('cg-theme-generate'),
                       document.getElementById('cg-theme-preview')];

        function csrfToken() {
            var input = document.querySelector('[name=csrfmiddlewaretoken]');
            if (input) return input.value;
            var match = document.cookie.match(/csrftoken=([^;]+)/);
            return match ? match[1] : '';
        }

        function escapeHtml(text) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(text === undefined || text === null ? '' : text));
            return div.innerHTML;
        }

        function setBusy(busy) {
            buttons.forEach(function(b) { if (b) b.disabled = busy; });
        }

        function setStatus(text, kind) {
            statusEl.className = kind ? 'cg-' + kind : '';
            statusEl.innerHTML = (kind === 'busy' ? '<span class="cg-spinner"></span>' : '') + escapeHtml(text);
        }

        function showResult(data) {
            var themeName = selectEl.options[selectEl.selectedIndex].text;
            var parts = [];
            parts.push('<h3>' + escapeHtml(data.title || 'Тематическая подборка') + '</h3>');

            var meta = [];
            meta.push('Тема: ' + escapeHtml(data.theme || themeName));
            meta.push(data.dry_run ? 'предпросмотр — ничего не сохранено' : 'пост сохранён');
            parts.push('<div class="cg-meta">' + meta.join(' · ') + '</div>');

            if (data.content_html) {
                parts.push(data.content_html);
                parts.push('<details><summary>Исходный MarkdownV2</summary>'
                    + '<textarea readonly>' + escapeHtml(data.content) + '</textarea></details>');
            } else {
                parts.push('<p style="color:var(--dsn-c-b36b00);">' + escapeHtml(data.message || 'Пост пуст') + '</p>');
            }

            if (!data.dry_run) {
                parts.push('<div style="margin-top:10px;">'
                    + '<a class="button" href="' + window.location.href + '">Обновить список</a></div>');
            }

            resultEl.innerHTML = parts.join('');
            resultEl.style.display = '';
        }

        function poll(taskId, dryRun) {
            var elapsed = 0;
            var timer = setInterval(function() {
                elapsed += POLL_INTERVAL;

                var form = new FormData();
                form.append('csrfmiddlewaretoken', csrfToken());
                form.append('task_id', taskId);
                form.append('dry_run', dryRun ? '1' : '0');

                fetch(STATUS_URL, {method: 'POST', body: form})
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.error) {
                            clearInterval(timer); setBusy(false);
                            setStatus('Ошибка: ' + data.error, 'error');
                            return;
                        }
                        if (data.status === 'pending') return;

                        clearInterval(timer); setBusy(false);
                        setStatus(dryRun ? 'Предпросмотр готов' : 'Пост сгенерирован', 'ok');
                        data.dry_run = dryRun;
                        showResult(data);
                    })
                    .catch(function() {
                        clearInterval(timer); setBusy(false);
                        setStatus('Потеряна связь с API', 'error');
                    });

                if (elapsed >= POLL_TIMEOUT) {
                    clearInterval(timer); setBusy(false);
                    setStatus('Таймаут ожидания задачи. Проверьте список позже.', 'error');
                }
            }, POLL_INTERVAL);
        }

        function run(dryRun) {
            setBusy(true);
            resultEl.style.display = 'none';
            setStatus(dryRun ? 'Собираю предпросмотр…' : 'Отправляю задачу в API…', 'busy');

            var form = new FormData();
            form.append('csrfmiddlewaretoken', csrfToken());
            form.append('filter_set_id', selectEl.value);
            form.append('dry_run', dryRun ? '1' : '0');

            fetch(THEME_URL, {method: 'POST', body: form})
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.error) {
                        setBusy(false);
                        setStatus('Ошибка: ' + data.error, 'error');
                        return;
                    }
                    if (data.task_id) {
                        setStatus('Задача в очереди (' + data.task_id.slice(0, 8) + '…), жду результат…', 'busy');
                        poll(data.task_id, dryRun);
                        return;
                    }
                    setBusy(false);
                    setStatus(dryRun ? 'Предпросмотр готов' : 'Пост сгенерирован', 'ok');
                    data.dry_run = dryRun;
                    showResult(data);
                })
                .catch(function() {
                    setBusy(false);
                    setStatus('Не удалось связаться с сервером', 'error');
                });
        }

        document.getElementById('cg-theme-generate').addEventListener('click', function() { run(false); });
        document.getElementById('cg-theme-preview').addEventListener('click', function() { run(true); });
    })();
    </script>

    {{ block.super }}
{% endblock %}
